name: P0 regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - run: npm install --no-save @playwright/test@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Run browser regression with server readiness check
        run: |
          python3 -m http.server 8080 > /tmp/royal-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8080/; then break; fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:8080/
          npx playwright test tests/browser-save-p0.spec.cjs tests/browser-perf.spec.cjs tests/browser-autoplay.spec.cjs tests/browser-migration.spec.cjs tests/browser-graphics.spec.cjs --workers=1 --reporter=line,junit --trace=retain-on-failure --screenshot=only-on-failure
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/junit.xml
      - name: Preserve web server logs
        if: always()
        run: |
          mkdir -p test-results
          if [ -f /tmp/royal-server.log ]; then cp /tmp/royal-server.log test-results/royal-server.log; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-browser-results
          path: test-results/
          if-no-files-found: ignore
