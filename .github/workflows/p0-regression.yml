name: P0 regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - run: npm install --no-save @playwright/test@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Run browser regression with server readiness check
        run: |
          python3 -m http.server 8080 > /tmp/royal-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8080/; then break; fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:8080/
          npx playwright test tests/browser-save-p0.spec.cjs tests/browser-perf.spec.cjs tests/browser-autoplay.spec.cjs tests/browser-migration.spec.cjs tests/browser-graphics.spec.cjs --workers=1 --reporter=line,junit --trace=retain-on-failure --screenshot=only-on-failure
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/junit.xml
      - name: Publish regression summary
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          output = Path(os.environ['GITHUB_STEP_SUMMARY'])
          report = Path('test-results/junit.xml')
          if not report.exists():
              output.open('a').write('## Browser regression\n\nJUnit report missing; inspect preceding steps and logs.\n')
          else:
              root = ET.parse(report).getroot()
              cases = root.findall('.//testcase')
              failed = [case for case in cases if case.find('failure') is not None or case.find('error') is not None]
              skipped = [case for case in cases if case.find('skipped') is not None]
              lines = ['## Browser regression', '', f'Total: {len(cases)} | Failed: {len(failed)} | Skipped: {len(skipped)}', '']
              for case in failed:
                  lines.append(f'- FAIL: {case.get("classname", "")} / {case.get("name", "")}')
              output.open('a').write('\n'.join(lines) + '\n')
          PY
      - name: Preserve web server logs
        if: always()
        run: |
          mkdir -p test-results
          if [ -f /tmp/royal-server.log ]; then cp /tmp/royal-server.log test-results/royal-server.log; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-browser-results
          path: test-results/
          if-no-files-found: ignore
