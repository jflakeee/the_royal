name: P0 regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - run: npm install --no-save @playwright/test@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8080 > /tmp/royal-server.log 2>&1 &
          npx playwright test tests/browser-save-p0.spec.cjs tests/browser-perf.spec.cjs tests/browser-autoplay.spec.cjs --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-browser-results
          path: test-results/
          if-no-files-found: ignore
