<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Royal — Minion Worlds</title><style>body{margin:0;background:#182b29;color:#f5f0df;font:16px system-ui}header{padding:14px;background:#243d36;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}main{max-width:900px;margin:auto;padding:12px}canvas{width:100%;height:auto;display:block;background:#7ca477;border-radius:12px;touch-action:manipulation}select{padding:10px;border:0;border-radius:9px;background:#e9c978;color:#202d2b;font-weight:bold}button{padding:10px;border:0;border-radius:9px;background:#e9c978;color:#202d2b;font-weight:bold}#log{min-height:2.5em}small{color:#cad9cf}</style></head><body><header><b>🏘️ THE ROYAL · MINION WORLDS</b><span id="hud"></span></header><main><p>나무·바위·꽃·열매를 클릭해 미니언에게 명령하세요. 도시가 성장하면 다음 도시로 이주합니다.</p><canvas id="world" width="800" height="480"></canvas><p id="log" aria-live="polite">📨 개체를 클릭하여 명령 전송</p><button id="reset">새 게임</button> <button id="heal">꽃 치료</button> <button id="auto" aria-pressed="true">🤖 자동 채집 켜짐</button> <label for="focus">채집 우선</label> <select id="focus" aria-label="자동 채집 우선 자원"><option value="-1">가까운 자원</option><option value="0">🌳 나무</option><option value="1">🪨 바위</option><option value="2">🌼 꽃</option><option value="3">🫐 열매</option></select> <label for="worker">미니언</label> <select id="worker" aria-label="역할 지정 미니언"></select> <label for="role">전문 역할</label> <select id="role" aria-label="미니언 전문 역할"><option value="general">전체 채집</option><option value="wood">🌳 벌목</option><option value="stone">🪨 채석</option><option value="flower">🌼 꽃 채집</option><option value="berry">🫐 열매 채집</option><option value="hunter">🏹 사냥꾼 (토끼)</option><option value="builder">🏗️ 건설가</option><option value="healer">🏥 치료사</option></select> <small>첫 플레이 가능 프로토타입 · 자동 저장</small></main><script src="game-core.js"></script><script src="animal-ai.js"></script><script src="rescue.js"></script><script>
const Core=RoyalCore,Animals=RoyalAnimals,Rescue=RoyalRescue;const c=document.getElementById('world'),x=c.getContext('2d'),hud=document.getElementById('hud'),log=document.getElementById('log');let s;const icons=['🌳','🪨','🌼','🫐'],names=['나무','바위','꽃','열매'],res=['wood','stone','flower','berry'];function newGame(){return{city:1,stock:{wood:0,stone:0,flower:0,berry:0},minions:[{x:390,y:270,job:null},{x:415,y:270,job:null},{x:435,y:270,job:null}],objects:Array.from({length:22},(_,i)=>({x:40+(i*137)%710,y:65+(i*83)%335,type:i%4,amount:1})),queue:[],migration:0}}try{s=Core.load(localStorage)||Core.migrate(newGame())}catch{s=Core.migrate(newGame())}Animals.init(s);const autoButton=document.getElementById('auto');function syncAuto(){autoButton.textContent=s.autoGather===false?'🤖 자동 채집 꺼짐':'🤖 자동 채집 켜짐';autoButton.setAttribute('aria-pressed',String(s.autoGather!==false))}syncAuto();const workerSelect=document.getElementById('worker'),roleSelect=document.getElementById('role');function syncWorkers(){let selected=workerSelect.value;workerSelect.innerHTML='';s.minions.forEach((m,i)=>{if(m.status==='dead')return;let option=document.createElement('option');option.value=String(i);option.textContent='미니언 '+(i+1)+' · Lv.'+Core.gatherLevel(m);workerSelect.appendChild(option)});if([...workerSelect.options].some(o=>o.value===selected))workerSelect.value=selected;roleSelect.value=s.minions[Number(workerSelect.value)]?.role||'general'}workerSelect.onchange=()=>{roleSelect.value=s.minions[Number(workerSelect.value)]?.role||'general'};roleSelect.onchange=()=>{let m=s.minions[Number(workerSelect.value)];if(Core.setRole(m,roleSelect.value)){log.textContent='🎯 미니언 전문 역할 변경';save()}};syncWorkers();const focusSelect=document.getElementById('focus');function syncFocus(){focusSelect.value=String(Number.isInteger(s.gatherFocus)?s.gatherFocus:-1)}syncFocus();focusSelect.onchange=()=>{s.gatherFocus=Number(focusSelect.value);save();log.textContent='🎯 자동 채집 우선순위 변경: '+focusSelect.options[focusSelect.selectedIndex].text};autoButton.onclick=()=>{s.autoGather=s.autoGather===false;syncAuto();save()};function save(){try{Core.save(localStorage,s)}catch(e){log.textContent='저장 실패: 저장 공간을 확인하세요'}}document.getElementById('heal').onclick=()=>{let m=s.minions.find(m=>m.status==='wounded'||m.status==='critical');if(!m){log.textContent='치료할 미니언이 없습니다';return}if(Math.hypot(m.x-415,m.y-265)>40){log.textContent='중상 미니언은 도시로 구조한 뒤 치료할 수 있습니다';return}if(Core.heal(s,m)){log.textContent='🌼 꽃으로 미니언 치료 완료';save()}else log.textContent='꽃이 부족합니다'};document.getElementById('reset').onclick=()=>{s=Core.migrate(newGame());Animals.init(s);syncAuto();syncFocus();syncWorkers();save();log.textContent='새 게임 시작'};function command(px,py){let o=s.objects.find(o=>Math.hypot(o.x-px,o.y-py)<30&&o.amount>0);if(!o){let a=s.animals.find(a=>a.hp>0&&Math.hypot(a.x-px,a.y-py)<35);if(a){let name=Animals.SPECIES[a.type].icon+' '+a.type;let action=confirm(name+' 발견! 공격 명령을 내릴까요?\n취소하면 관찰만 합니다.');if(action){let ok=Animals.attack(s,a.id);log.textContent=ok?'⚔️ '+name+' 공격 명령 전달':'대기 중인 미니언이 없습니다'}else log.textContent='👀 '+name+' 관찰 중';save()}return}let job={x:o.x,y:o.y,type:o.type,phase:'travel',progress:0};let m=s.minions.find(m=>!m.job&&m.status!=='dead'&&m.status!=='critical');if(m&&m.status!=='dead'&&m.status!=='critical')m.job=job;else s.queue.push(job);log.textContent='📨 '+names[o.type]+' 클릭 → 미니언에게 '+names[o.type]+' 수집 명령 전달';save()}c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect();command((e.clientX-r.left)*800/r.width,(e.clientY-r.top)*480/r.height)});function update(dt){if(s.migration>0){s.migration-=dt;if(s.migration<=0){let next=s.city+1;let history=[...s.history,{city:s.city,buildings:s.buildings,stock:s.stock,population:Core.living(s)}];s=Core.migrate(newGame());Animals.init(s);syncAuto();syncFocus();syncWorkers();s.city=next;s.history=history;log.textContent='🏘️ 이전 도시 기록 보존! 제'+next+'도시 개척 시작';save()}return}Core.replenish(s,dt);for(let event of Animals.tick(s,dt)){if(event.kind==='hit')log.textContent='⚠️ 미니언 피해: '+event.outcome;else if(event.kind==='defeated'){log.textContent='🥩 동물 퇴치! 고기 1개 획득';save()}}for(let e of Rescue.rescue(s,dt)){if(e.kind==='rescue-start')log.textContent='🚑 중상 미니언 구조 출동';if(e.kind==='rescue-done')log.textContent='🏥 구조 완료, 치료 대기';save()}if(!s.minions.some(m=>m.role==="healer"&&m.status==="healthy")&&Rescue.treat(s)){log.textContent='🌼 미니언 치료 완료';save()}for(let m of s.minions){if(m.job&&['combat','retreat','rescue'].includes(m.job.kind))continue;if(m.status==='dead'||m.status==='critical')continue;if(!m.job&&s.queue.length){let i=s.queue.findIndex(j=>s.objects.some(o=>o.amount>0&&o.type===j.type));if(i>=0)m.job=s.queue.splice(i,1)[0]}if(Core.urgentHeal(s,m)){log.textContent="🚑 치료사가 긴급 치료 후 작업 복귀 준비";save()}if(!m.job)Core.resumeJob(m);if(!m.job&&Core.autoBuild(s,m)){log.textContent="🏗️ 건설가가 건물 건설 완료";save()}if(!m.job&&Core.autoHeal(s,m)){log.textContent="🏥 치료사가 미니언 치료 완료";save()}if(!m.job){const target=Core.autoHunt(s,m);if(target)Animals.attack(s,target,m.id)}if(!m.job)Core.autoAssign(s,m);if(m.job&&["combat","retreat","rescue"].includes(m.job.kind))continue;if(!m.job)continue;if(m.job.phase!=='return'&&!s.objects.some(o=>o.amount>0&&o.type===m.job.type&&o.x===m.job.x&&o.y===m.job.y)){if(!Core.retarget(s,m.job)){s.queue.push({...m.job,phase:'travel',progress:0});m.job=null;continue}log.textContent='🔄 자원이 사라져 다른 위치로 채집 경로 변경'}let j=m.job,target=j.phase==='return'?{x:415,y:265}:j,dx=target.x-m.x,dy=target.y-m.y,d=Math.hypot(dx,dy);if(d>3){let step=Math.min(d,85*dt);m.x+=dx/d*step;m.y+=dy/d*step}else if(j.phase==='travel'){j.phase='work';j.progress=0}else if(j.phase==='work'){j.progress+=dt;if(j.progress>Core.gatherTime(m)){let o=s.objects.find(o=>o.x===j.x&&o.y===j.y);if(Core.harvest(s,j)){j.got=true;log.textContent='✨ '+names[j.type]+' 수집 성공! 다른 위치에서 다시 나타납니다';save()}j.phase='return'}}else{if(j.got){s.stock[res[j.type]]++;m.gatherXp=(m.gatherXp||0)+1;syncWorkers()}m.job=null;let type=Core.nextBuilding(s);if(!s.minions.some(m=>m.role==="builder"&&m.status==="healthy")&&Core.build(s,type)){log.textContent='🏗️ '+type+' 건설 완료 (목재·석재만 소비)'}if(Core.migrationReady(s)&&!s.migration){s.migration=5;log.textContent='🎉 도시 완성! 새로운 도시로 이주합니다'}save()}}let recruited=Core.recruitAvailable(s);if(recruited.total){syncWorkers();log.textContent='🎉 미니언 '+recruited.total+'명 합류! (🥩 '+recruited.meat+' · 🫐 '+recruited.berry+')';save()}}function draw(){x.clearRect(0,0,800,480);x.fillStyle='#88b17e';x.fillRect(0,0,800,480);x.fillStyle='#a9bf85';for(let i=0;i<12;i++)x.fillRect((i*91)%800,(i*71)%480,30,9);x.fillStyle='#d4b98b';x.beginPath();x.ellipse(416,265,110+(s.cityLevel||0)*17,66+(s.cityLevel||0)*12,0,0,7);x.fill();x.font='42px serif';x.textAlign='center';x.fillText('🏠',410,258);if((s.cityLevel||0)>0)x.fillText('🏡',350,295);if((s.cityLevel||0)>1)x.fillText('🏘️',475,295);x.font='30px serif';for(let o of s.objects)if(o.amount>0){let a=Math.min(1,Math.max(0,1-(o.appear||0)));x.save();x.globalAlpha=.35+.65*a;x.translate(o.x,o.y);x.scale(.65+.35*a,.65+.35*a);x.fillText(icons[o.type],0,0);x.restore();if(o.appear>0){x.fillStyle='#fff4a3';x.font='17px serif';x.fillText('✨',o.x+19,o.y-15)}}for(let a of s.animals){if(a.hp<=0)continue;x.font='28px serif';x.fillText(Animals.SPECIES[a.type].icon,a.x,a.y);x.font='10px system-ui';x.fillStyle='#fff';x.fillText(a.state,a.x,a.y-24)}for(let m of s.minions){if(m.status==='dead')continue;x.font='25px serif';x.fillText(m.status==='critical'?'🩹':'👷',m.x,m.y);if(m.status==='wounded'||m.status==='critical'){x.fillStyle=m.status==='critical'?'#e44':'#e9c978';x.fillRect(m.x-14,m.y-33,28*Math.max(0,m.hp/m.maxHp),4)}if(m.job){x.font='12px system-ui';x.fillStyle='#fff';x.fillText(m.job.kind==='combat'?'전투 중':m.job.kind==='rescue'?'구조 중':m.job.kind==='retreat'?'후퇴 중':m.job.phase==='work'?'작업 중':m.job.phase==='return'?'운반 중':'이동 중',m.x,m.y-25)}}if(s.migration>0){x.fillStyle='#152a28cc';x.fillRect(0,0,800,480);x.fillStyle='#fff';x.font='28px system-ui';x.fillText('🚶🚶🚶 새로운 도시로 이주 중...',400,230)}hud.textContent='도시 '+s.city+' · 건물 '+s.buildings.length+' · 👷'+Core.living(s)+'/'+Core.housing(s)+' · 이주 '+(Core.migrationReady(s)?'준비완료':'건물 '+s.buildings.length+'/8 · 인구 '+Core.living(s)+'/10')+' · 🪵'+s.stock.wood+' 🪨'+s.stock.stone+' 🌼'+s.stock.flower+' 🫐'+s.stock.berry+' 🥩'+s.stock.meat+(s.stock.meat>=3&&Core.living(s)>=Core.housing(s)?' · 🏠 주거 부족':'')};let last=performance.now();function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);setInterval(save,3000);
</script></body></html>
